<nav class="navbar">
  <div class="navbar-left">
    <!-- Hamburger Menu -->
    <button class="hamburger-btn" (click)="toggleSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Greeting -->
    <div class="greeting">
      <h1>Greetings Clyde!</h1>
    </div>
  </div>

  <div class="navbar-center">
    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input 
          type="text" 
          placeholder="Search..." 
          class="search-input"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()">
      </div>
    </div>
  </div>

  <div class="navbar-right">
    <!-- User Profile -->
    <div class="user-section" (click)="openProfile()">
      <div class="user-avatar">
        <img [src]="user.avatar" [alt]="user.name" />
      </div>
      <span class="user-name">{{ user.name }}</span>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <!-- Settings -->
      <button class="action-btn" (click)="openSettings()" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1m17-4a4 4 0 0 1-8 0 4 4 0 0 1 8 0zM7 21a4 4 0 0 1-8 0 4 4 0 0 1 8 0z"></path>
        </svg>
      </button>

      <!-- Notifications -->
      <button class="action-btn notification-btn" (click)="openNotifications()" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
      </button>

      <!-- Messages -->
      <button class="action-btn message-btn" (click)="openMessages()" title="Messages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span class="notification-badge" *ngIf="messageCount > 0">{{ messageCount }}</span>
      </button>

      <!-- Logout -->
      <button class="action-btn logout-btn" (click)="logout()" title="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16,17 21,12 16,7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</nav>
