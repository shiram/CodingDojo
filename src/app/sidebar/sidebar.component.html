<p>sidebar works!</p>
<div class="sidebar">
  <!-- Logo Section -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 6v6l4 2"></path>
        </svg>
      </div>
      <span class="logo-text">Material Dash</span>
    </div>
  </div>

  <!-- User Profile Section -->
  <div class="user-profile">
    <div class="user-avatar">
      <img [src]="user.avatar" [alt]="user.name" />
    </div>
    <div class="user-info">
      <div class="user-name">{{ user.name }}</div>
      <div class="user-email">{{ user.email }}</div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li class="nav-item" *ngFor="let item of menuItems">
        <div class="nav-link" 
             [class.active]="item.label === 'Dashboard'"
             (click)="item.hasSubmenu ? toggleSubmenu(item) : navigateTo(item.route || '')">
          <div class="nav-link-content">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <!-- Home icon -->
              <path *ngIf="item.icon === 'home'" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline *ngIf="item.icon === 'home'" points="9,22 9,12 15,12 15,22"></polyline>
              
              <!-- Clipboard icon -->
              <path *ngIf="item.icon === 'clipboard'" d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect *ngIf="item.icon === 'clipboard'" x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              
              <!-- Grid icon -->
              <rect *ngIf="item.icon === 'grid'" x="3" y="3" width="7" height="7"></rect>
              <rect *ngIf="item.icon === 'grid'" x="14" y="3" width="7" height="7"></rect>
              <rect *ngIf="item.icon === 'grid'" x="14" y="14" width="7" height="7"></rect>
              <rect *ngIf="item.icon === 'grid'" x="3" y="14" width="7" height="7"></rect>
              
              <!-- Table icon -->
              <path *ngIf="item.icon === 'table'" d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"></path>
              
              <!-- Bar Chart icon -->
              <line *ngIf="item.icon === 'bar-chart'" x1="12" y1="20" x2="12" y2="10"></line>
              <line *ngIf="item.icon === 'bar-chart'" x1="18" y1="20" x2="18" y2="4"></line>
              <line *ngIf="item.icon === 'bar-chart'" x1="6" y1="20" x2="6" y2="16"></line>
              
              <!-- Layers icon -->
              <polygon *ngIf="item.icon === 'layers'" points="12,2 2,7 12,12 22,7 12,2"></polygon>
              <polyline *ngIf="item.icon === 'layers'" points="2,17 12,22 22,17"></polyline>
              <polyline *ngIf="item.icon === 'layers'" points="2,12 12,17 22,12"></polyline>
              
              <!-- Book icon -->
              <path *ngIf="item.icon === 'book'" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path *ngIf="item.icon === 'book'" d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              
              <!-- Circle icon for submenu items -->
              <circle *ngIf="item.icon === 'circle'" cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="nav-text">{{ item.label }}</span>
          </div>
          <svg *ngIf="item.hasSubmenu" 
               class="nav-arrow" 
               [class.expanded]="item.isExpanded"
               width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 12,15 18,9"></polyline>
          </svg>
        </div>
        
        <!-- Submenu -->
        <ul class="submenu" *ngIf="item.hasSubmenu && item.isExpanded">
          <li class="submenu-item" *ngFor="let subItem of item.submenuItems">
            <div class="submenu-link" (click)="navigateTo(subItem.route || '')">
              <svg class="submenu-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <span class="submenu-text">{{ subItem.label }}</span>
            </div>
          </li>
        </ul>
      </li>
    </ul>
  </nav>

  <!-- Bottom Actions -->
  <div class="sidebar-footer">
    <div class="footer-actions">
      <button class="footer-link" (click)="openSettings()">Settings</button>
      <span class="footer-divider">|</span>
      <button class="footer-link" (click)="logout()">Logout</button>
    </div>
  </div>
</div>
