<div class="sign-in-container">
  <!-- Top right action buttons -->

  <!-- Main sign-in card -->
  <div class="sign-in-card">
    <!-- Login icon -->
    <div class="icon-container">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10,17 15,12 10,7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
    </div>

    <!-- Header -->
    <h1 class="title">Document Esign Tool - Login</h1>
    <p class="subtitle">
      Upload Your PDF Document,<br>
      get it signed by your team. For free !!
    </p>

    <!-- Form -->
    <form class="sign-in-form" (ngSubmit)="onSubmit()">
      <!-- Email field -->
      <div class="input-group">
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input 
            type="email" 
            placeholder="Email" 
            class="form-input"
            [(ngModel)]="email"
            name="email"
            required>
        </div>
      </div>

      <!-- Password field -->
      <div class="input-group">
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <circle cx="12" cy="16" r="1"></circle>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            placeholder="Password" 
            class="form-input"
            [(ngModel)]="password"
            name="password"
            required>
          <button 
            type="button" 
            class="password-toggle"
            (click)="togglePassword()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" *ngIf="!showPassword"></path>
              <circle cx="12" cy="12" r="3" *ngIf="!showPassword"></circle>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" *ngIf="showPassword"></path>
              <line x1="1" y1="1" x2="23" y2="23" *ngIf="showPassword"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot password link -->
      <div class="forgot-password">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit button -->
      <button type="submit" class="submit-btn">Get Started</button>
    </form>

    <!-- Divider -->
    <!--<div class="divider">
      <span class="divider-text">Or sign in with</span>
    </div>-->

    <div class="signup-in-link">
      <span class="link-text">No account yet? </span>
      <a href="#" class="link" (click)="goToSignUpPage(); $event.preventDefault()">Sign Up</a>
    </div>
